name: checks

on:
  push:
  pull_request:

jobs:
  compile-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile all Python files
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          files = [p for p in Path('.').rglob('*.py') if '.venv' not in p.parts]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f'Compiled {len(files)} Python files.')
          PY

      - name: Simulator + check_setup smoke test
        run: |
          pip install numpy
          python tools/ppg_simulator.py --scenario plain --port 3333 &
          SIM=$!
          sleep 2
          python tools/check_setup.py --stream 127.0.0.1:3333 || true
          kill $SIM
